<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Weather App</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-searchbar
    placeholder="Search for a city">
  </ion-searchbar>

  <ion-button expand="block">
    Search
  </ion-button>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Toronto</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <h2>🌡 24°C</h2>
      <p>☁ Cloudy</p>
      <p>💧 Humidity: 60%</p>
      <p>🌬 Wind: 15 km/h</p>
    </ion-card-content>
  </ion-card>

</ion-content>
