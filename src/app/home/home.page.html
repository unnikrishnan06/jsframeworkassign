<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Weather App</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-searchbar
    placeholder="Search for a city">
  </ion-searchbar>

  <ion-button expand="block" (click)="loadWeather()">
    Search
  </ion-button>

  <ion-card *ngIf="weatherData">
    <ion-card-header>
      <ion-card-title>Toronto</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <h2>🌡 {{ weatherData.temperature_2m }}°C</h2>
      <p>💧 Humidity: {{ weatherData.relative_humidity_2m }}%</p>
      <p>🌬 Wind: {{ weatherData.wind_speed_10m }} km/h</p>
    </ion-card-content>
  </ion-card>

</ion-content>
